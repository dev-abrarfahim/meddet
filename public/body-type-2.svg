<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 520" width="100%" height="100%">
  <!-- NORMAL (18.5-24.9) -->
  <defs>
    <linearGradient id="ped-grad-2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7CB342" />
      <stop offset="100%" stop-color="#558B2F" />
    </linearGradient>
  </defs>

  <!-- Male Normal Athletic Silhouette -->
  <g id="normal-male" fill="#004D6D">
    <!-- Hair style with neat volume -->
    <path d="M88 26 C100 18 116 20 122 27 C126 31 123 37 123 42 C126 47 123 54 118 58 C115 63 108 67 100 67 C92 67 85 64 81 59 C77 54 77 47 79 42 C78 35 80 28 88 26 Z" />
    <!-- Head / Face -->
    <ellipse cx="100" cy="48" rx="17" ry="21" />
    <!-- Neck -->
    <path d="M91 66 L109 66 L111 84 L89 84 Z" />
    <!-- Athletic V-Taper Torso -->
    <path d="M62 84 C78 87 100 88 138 84 C140 106 134 146 126 188 C117 192 105 193 100 193 C95 193 83 192 74 188 C66 146 60 106 62 84 Z" />
    <!-- Left Arm (Athletic contour) -->
    <path d="M61 85 C50 99 46 140 44 204 C44 210 52 210 55 204 C59 152 64 110 68 89 Z" />
    <!-- Right Arm (Athletic contour) -->
    <path d="M139 85 C150 99 154 140 156 204 C156 210 148 210 145 204 C141 152 136 110 132 89 Z" />
    <!-- Hands -->
    <ellipse cx="49" cy="208" rx="5" ry="8" />
    <ellipse cx="151" cy="208" rx="5" ry="8" />
    <!-- Left Leg (Defined quadriceps and calves) -->
    <path d="M76 189 C83 222 86 292 84 410 C84 416 71 416 71 410 C72 292 74 222 75 189 Z" />
    <!-- Right Leg (Defined quadriceps and calves) -->
    <path d="M124 189 C117 222 114 292 116 410 C116 416 129 416 129 410 C128 292 126 222 125 189 Z" />
    <!-- Feet resting on peak -->
    <ellipse cx="79" cy="413" rx="10" ry="5.5" />
    <ellipse cx="121" cy="413" rx="10" ry="5.5" />
  </g>

  <!-- Triangular Pedestal Banner -->
  <g id="pedestal">
    <polygon points="12,450 100,418 188,450 188,484 12,484" fill="url(#ped-grad-2)" />
    <!-- White Category Label -->
    <text x="100" y="474" text-anchor="middle" fill="#FFFFFF" font-family="'Poppins', sans-serif" font-weight="900" font-size="18" letter-spacing="1">
      NORMAL
    </text>
    <!-- BMI Range -->
    <text x="100" y="510" text-anchor="middle" fill="#004D6D" font-family="'Poppins', sans-serif" font-weight="800" font-size="19">
      18.5-24.9
    </text>
  </g>
</svg>
