<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Google Search Console Verification Meta Tag -->
    <meta name="google-site-verification" content="KPWbWFKBPzztdhTDL7I3DIZhhLfvfRWAHX3OSsmr-rA" />

    <!-- Google Site Name Signal for Search Results -->
    <meta property="og:site_name" content="MedVhai" />
    <meta name="application-name" content="MedVhai" />
    <meta name="apple-mobile-web-app-title" content="MedVhai" />

    <!-- Primary SEO Meta Tags -->
    <title>MedVhai™ - Clinical Drug Index & Medicine Price BD</title>
    <meta name="title" content="MedVhai™ - Clinical Drug Index & Medicine Price BD" />
    <meta name="description" content="Bangladesh's clinical drug index & medicine price guide. Search 30,000+ brand medicines, generic ingredients, BDT MRP prices & alternatives." />
    <meta name="keywords" content="MedVhai, Medicine Index, Drug Price BD, Generic Medicine BD, Napa, Seclo, Maxpro, Paracetamol, Esomeprazole, Medicine Directory Bangladesh, Beximco Pharma, Square Pharma, Incepta" />
    <meta name="author" content="MedVhai Clinical Index" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://medvhai.heliox.workers.dev/" />

    <!-- Enterprise SEO Favicon Suite -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Open Graph / Facebook SEO Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://medvhai.heliox.workers.dev/" />
    <meta property="og:title" content="MedVhai™ - Clinical Drug Index & Medicine Price BD" />
    <meta property="og:description" content="Bangladesh's clinical drug index & medicine price guide. Search 30,000+ brand medicines, generic active ingredients, BDT MRP prices, and lower-cost alternative brands." />
    <meta property="og:image" content="https://medvhai.heliox.workers.dev/logo.png" />

    <!-- Twitter Card SEO Meta Tags -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://medvhai.heliox.workers.dev/" />
    <meta property="twitter:title" content="MedVhai™ - Clinical Drug Index & Medicine Price BD" />
    <meta property="twitter:description" content="Bangladesh's clinical drug index & medicine price guide. Search 30,000+ brand medicines, generic active ingredients, BDT MRP prices, and lower-cost alternative brands." />
    <meta property="twitter:image" content="https://medvhai.heliox.workers.dev/logo.png" />

    <!-- High-Performance Non-Render-Blocking Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" />
    </noscript>

    <!-- Schema.org WebSite Structured Data (Explicit Google Site Name Signal) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "MedVhai",
      "alternateName": ["MedVhai BD", "MedVhai Health Index", "MedVhai Clinical Index"],
      "url": "https://medvhai.heliox.workers.dev/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://medvhai.heliox.workers.dev/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Schema.org MedicalWebPage Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "MedicalWebPage",
      "name": "MedVhai™ - Clinical Drug Index & Medicine Price BD",
      "description": "Comprehensive clinical drug database for brand medicines, active generic ingredients, MRP prices in BDT, lower-cost alternative brands, and bilingual clinical monographs.",
      "url": "https://medvhai.heliox.workers.dev/",
      "audience": {
        "@type": "MedicalAudience",
        "audienceType": ["Patients", "Doctors", "Pharmacists", "Medical Students"]
      },

      "inLanguage": ["en", "bn"],
      "publisher": {
        "@type": "Organization",
        "name": "MedVhai Health Index",
        "logo": "https://medvhai.heliox.workers.dev/logo.png"
      }
    }
    </script>
    <!-- Dark Mode FOUC Prevention (blocks rendering flash) -->
    <script>
      try {
        const d = localStorage.getItem('medvhai_dark_mode');
        if (d === 'true' || (!d && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch(e) {}
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Inline Critical Loading Skeleton (instant FCP before React hydrates) -->
      <style>
        .mv-skel{font-family:system-ui,-apple-system,sans-serif;min-height:100vh;background:#F1F9FF}
        .dark .mv-skel{background:#0B131B}
        .mv-skel-hdr{height:64px;background:#095D7E;display:flex;align-items:center;padding:0 16px}
        .dark .mv-skel-hdr{background:#0B1927}
        .mv-skel-logo{height:32px;width:120px;background:rgba(255,255,255,0.15);border-radius:6px}
        .mv-skel-bar{height:44px;background:#074760;display:flex;align-items:center;padding:0 16px}
        .dark .mv-skel-bar{background:#0E2439}
        .mv-skel-search{height:32px;width:100%;max-width:640px;margin:0 auto;background:rgba(255,255,255,0.12);border-radius:8px}
        .mv-skel-hero{margin:16px;padding:32px 24px;background:linear-gradient(135deg,#095D7E,#074760,#042C3C);border-radius:16px;text-align:center}
        .dark .mv-skel-hero{background:linear-gradient(135deg,#0B1927,#0E2439,#07131F)}
        .mv-skel-h1{color:#E2FCD6;font-size:20px;font-weight:900;margin:0 0 8px}
        .mv-skel-p{color:#CCECEE;font-size:14px;margin:0;opacity:0.85}
        @keyframes mv-pulse{0%,100%{opacity:1}50%{opacity:0.5}}
        .mv-skel-pulse{animation:mv-pulse 1.5s ease-in-out infinite}
      </style>
      <div class="mv-skel" aria-hidden="true">
        <div class="mv-skel-hdr"><div class="mv-skel-logo mv-skel-pulse"></div></div>
        <div class="mv-skel-bar"><div class="mv-skel-search mv-skel-pulse"></div></div>
        <div class="mv-skel-hero">
          <div class="mv-skel-h1">MedVhai™</div>
          <p class="mv-skel-p">Clinical Drug Index & Medicine Price BD</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
